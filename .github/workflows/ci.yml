name: ci
on: [push, pull_request]
jobs:
  core:
    # the watcher is standard library only: this job runs it with NO third-party package present
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: The modules must import with no third-party package installed
        run: |
          python -c "import omega_evidence" 2>/dev/null && { echo "omega_evidence must not be installed here"; exit 1; } || true
          python -c "import cryptography" 2>/dev/null && { echo "cryptography must not be installed here"; exit 1; } || true
          python -I -c "import sys; sys.path.insert(0, '.'); import rwawatch, rwawatch_agents, rwawatch_orchestrator; print('stdlib only, imports ok')"
      - name: Offline suite (no network, no wall clock; every write under a temp dir — the checkout must stay byte-identical, ignored files included)
        run: |
          before=$(git status --porcelain --ignored)
          python -B tests/test_rwawatch.py 2>&1 | tee /tmp/tests.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -qE "^Ran [0-9]+ tests" /tmp/tests.log && grep -q "^OK" /tmp/tests.log
          [ "$(git status --porcelain --ignored)" = "$before" ] || { echo "a test wrote into the checkout:"; git status --porcelain --ignored; exit 1; }
          test ! -e ~/.config/omega-rwawatch || { echo "a test wrote outside its temp dir (production key path)"; exit 1; }

  ablation:
    # tools/ablate_guards.py mutates one guard at a time and re-runs the suite: every mutation MUST turn the suite red.
    # A mutation the suite does not catch is a guard nobody has tested — that is a failure here, not a warning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Every scripted mutation of a guard must make the suite fail
        run: |
          mkdir -p /tmp/abl/home
          python -B tools/ablate_guards.py /tmp/abl 2>&1 | tee /tmp/ablation.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "^mutations surviving: 0 of " /tmp/ablation.log
          grep -q "^GREEN!" /tmp/ablation.log && { echo "a mutation survived"; exit 1; } || true
          grep -q "^??" /tmp/ablation.log && { echo "a mutation pattern no longer matches the source"; exit 1; } || true

  evidence:
    # the OPTIONAL signed evidence pack: omega-evidence (GitHub, pinned by commit in pyproject — not on PyPI) + cryptography
    # for the ML-DSA-65 co-signature. The same suite then exercises the signing path with keys the tests create under
    # their temp dir (mode 0600): no production key and no repository secret is used or needed in CI.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the evidence extra (omega-evidence from GitHub at the commit of v0.9.1; cryptography >= 48 for ML-DSA-65)
        run: |
          pip install ".[evidence]" "cryptography>=48"
          python -c "import omega_evidence, cryptography; from omega_evidence.pqbackends import mldsa; print('omega_evidence', omega_evidence.__version__ if hasattr(omega_evidence, '__version__') else 'ok', 'cryptography', cryptography.__version__, 'mldsa', mldsa.available())"
          python -c "from omega_evidence.pqbackends import mldsa; assert mldsa.available(), 'ML-DSA-65 backend must be available with this cryptography'"
      - name: Offline suite with the signing path live (checkout byte-identical after the pip build artifacts; no key written outside the temp dir)
        run: |
          before=$(git status --porcelain --ignored)     # pip's in-tree build leaves build/ and *.egg-info (ignored): recorded, not blamed on the tests
          python -B tests/test_rwawatch.py 2>&1 | tee /tmp/tests.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "^OK" /tmp/tests.log
          [ "$(git status --porcelain --ignored)" = "$before" ] || { echo "a test wrote into the checkout:"; git status --porcelain --ignored; exit 1; }
          test ! -e ~/.config/omega-rwawatch || { echo "a test wrote outside its temp dir (production key path)"; exit 1; }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: gitleaks (whole history, pinned binary, default rules, no allowlist)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks && ./gitleaks git . --redact --exit-code 1

  evidence-newest:
    # The `evidence` extra is pinned to the commit of omega-evidence v0.9.1 (reproducible). This job installs the NEWEST
    # omega-evidence from the index instead: a release that breaks the signed pack turns this repository red first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: "This package + the newest omega-evidence from the index + cryptography >= 48 (ML-DSA-65)"
        run: |
          pip install . "cryptography>=48"
          pip install --extra-index-url https://robertolocatelli81-dev.github.io/pypi/ omega-evidence
          python -c "import importlib.metadata as m; from omega_evidence.pqbackends import mldsa; print('omega-evidence', m.version('omega-evidence')); assert mldsa.available()"
      - name: "Offline suite with the signing path live, against the newest omega-evidence"
        run: |
          python -B tests/test_rwawatch.py 2>&1 | tee /tmp/tests.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "^OK" /tmp/tests.log
