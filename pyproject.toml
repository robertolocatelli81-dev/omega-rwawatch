[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-rwawatch"
version = "0.2.0"
description = "Hash-chained on-chain readings of tokenized money-market / treasury fund tokens (BUIDL, JLTXX, MONY, BENJI, USYC) on ten public chains, with a node-identity, freshness and positive-control gate per chain and a deterministic council. Verify != predict; not a NAV/AUM feed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSL-1.1" }
authors = [{ name = "Roberto Locatelli" }]
keywords = ["rwa", "tokenized-funds", "buidl", "on-chain", "audit", "hash-chain", "data-integrity", "eip-712", "evm", "solana", "aptos", "stellar"]
dependencies = []   # stdlib only (measured on 3.9, 3.11, 3.13 — see .github/workflows/ci.yml)

# The extra is needed ONLY for the optional signed evidence pack, never by the watcher itself.
# omega-evidence is not on PyPI: it is installed from GitHub, pinned to the COMMIT of tag v0.9.1 (a tag can be moved,
# a commit hash cannot; resolved 2026-09-28 from the remote: v0.9.1^{} = 1dacd117). cryptography >= 48 adds ML-DSA-65.
[project.optional-dependencies]
evidence = ["omega-evidence @ git+https://github.com/robertolocatelli81-dev/omega-evidence@1dacd11741ab8aa53b9507219b3717681c6c598b"]

[project.scripts]
rwawatch = "rwawatch_orchestrator:run_cycle"

[tool.setuptools]
py-modules = ["rwawatch", "rwawatch_agents", "rwawatch_orchestrator"]
